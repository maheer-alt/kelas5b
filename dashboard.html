<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard — Kelas 5B</title>

    <link rel="stylesheet" href="css/sidebar.css">

    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

    <div id="sidebar"></div>

    <main class="dashboard">

        <header class="topbar">

            <div>
                <p class="mini-label">
                    KELAS 5B
                </p>

                <h1>
                    Dashboard
                </h1>
            </div>

            <div class="profile-mini">
                <div id="miniAvatar">
                    ?
                </div>

                <span id="miniName">
                    Loading...
                </span>
            </div>

        </header>


        <section class="hero">

            <div>

                <p class="hero-label">
                    CLASS SPACE
                </p>

                <h2>
                    Selamat datang,<br>
                    <span id="heroName">
                        Teman.
                    </span>
                </h2>

                <p>
                    Tempat berkumpulnya siswa Kelas 5B.
                </p>

            </div>

            <div class="hero-orb">
                <img src="assets/logo.jpeg" alt="Logo Kelas 5B">
            </div>

        </section>


        <section class="stats">

            <div class="stat-card">
                <span>01</span>
                <strong>Profil</strong>
                <p>Kelola data dirimu.</p>
            </div>

            <div class="stat-card">
                <span>02</span>
                <strong>Teman</strong>
                <p>Lihat teman sekelas.</p>
            </div>

            <div class="stat-card">
                <span>03</span>
                <strong>Kelas</strong>
                <p>Ruang digital 5B.</p>
            </div>

        </section>

    </main>

    <script type="module" src="js/dashboard.js"></script>

</body>

</html>
