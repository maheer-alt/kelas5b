<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile — Kelas 5B</title>

    <link rel="icon" href="assets/rocket.ico">

    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/profile.css">
</head>

<body>

    <!-- SIDEBAR -->
    <div id="sidebar"></div>

    <!-- PROFILE PAGE -->
    <main class="profile-page">

        <!-- HEADER -->
        <header>
            <p>ACCOUNT</p>
            <h1>Profile</h1>
        </header>

        <!-- PROFILE CARD -->
        <section class="profile-card">

            <!-- AVATAR -->
            <div class="avatar-wrapper">

                <div class="avatar" id="avatar">
                    ?
                </div>

                <label
                    for="avatarInput"
                    class="avatar-upload"
                    id="avatarUploadButton"
                >
                    Ganti Foto
                </label>

                <input
                    type="file"
                    id="avatarInput"
                    accept="image/webp"
                    hidden
                >

                <small
                    class="avatar-hint"
                    id="avatarHint"
                >
                    WebP • Maks. 1 MB
                </small>

            </div>

            <!-- PROFILE INFO -->
            <div class="profile-info">

                <!-- FULL NAME -->
                <h2 id="fullName">
                    <span id="fullNameText">
                        Loading...
                    </span>
                </h2>

                <!-- USERNAME + VERIFIED -->
                <div class="username-row">

                    <span id="username">
                        @loading
                    </span>

                    <img
                        id="verifiedBadge"
                        class="verified-badge"
                        src="/assets/centang.png"
                        alt="Verified"
                        hidden
                    >

                </div>

                <!-- BIO -->
                <p id="bio">
                    Belum ada bio.
                </p>

                <!-- EDIT BUTTON -->
                <button
                    type="button"
                    id="editProfileButton"
                    class="edit-profile-button"
                >
                    Edit Profile
                </button>

            </div>

        </section>

        <!-- EDIT PROFILE -->
        <section
            class="edit-profile"
            id="editProfile"
            hidden
        >

            <div class="edit-header">

                <small>
                    EDIT ACCOUNT
                </small>

                <h2>
                    Edit Profile
                </h2>

            </div>

            <form id="profileForm">

                <!-- NAME -->
                <div class="form-group">

                    <label for="nameInput">
                        NAMA
                    </label>

                    <input
                        type="text"
                        id="nameInput"
                        maxlength="50"
                        placeholder="Nama kamu"
                        autocomplete="name"
                        required
                    >

                </div>

                <!-- USERNAME -->
                <div class="form-group">

                    <label for="usernameInput">
                        USERNAME
                    </label>

                    <div class="username-input">

                        <span>@</span>

                        <input
                            type="text"
                            id="usernameInput"
                            maxlength="30"
                            placeholder="username"
                            autocomplete="username"
                            required
                        >

                    </div>

                    <small class="input-hint">
                        Hanya huruf, angka, dan underscore.
                    </small>

                </div>

                <!-- BIO -->
                <div class="form-group">

                    <label for="bioInput">
                        BIO
                    </label>

                    <textarea
                        id="bioInput"
                        maxlength="500"
                        placeholder="Ceritakan sedikit tentang kamu..."
                    ></textarea>

                    <div class="bio-counter">

                        <span>
                            Maksimal 500 karakter
                        </span>

                        <strong id="bioCounter">
                            0/500
                        </strong>

                    </div>

                </div>

                <!-- EDIT MESSAGE -->
                <p
                    id="editMessage"
                    class="edit-message"
                ></p>

                <!-- ACTIONS -->
                <div class="edit-actions">

                    <button
                        type="button"
                        id="cancelEditButton"
                        class="cancel-button"
                    >
                        Batal
                    </button>

                    <button
                        type="submit"
                        class="save-button"
                    >
                        Simpan Perubahan
                    </button>

                </div>

            </form>

        </section>

        <!-- PROFILE DETAILS -->
        <section class="profile-details">

            <!-- EMAIL -->
            <div>

                <small>
                    EMAIL
                </small>

                <p id="email">
                    -
                </p>

            </div>

            <!-- USERNAME -->
            <div>

                <small>
                    USERNAME
                </small>

                <p id="username2">
                    -
                </p>

            </div>

        </section>

        <!-- AVATAR MESSAGE -->
        <p
            id="avatarMessage"
            class="avatar-message"
        ></p>

    </main>

    <!-- PROFILE JAVASCRIPT -->
    <script
        type="module"
        src="js/profile.js"
    ></script>

</body>

</html>
